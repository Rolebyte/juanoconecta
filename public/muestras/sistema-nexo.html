<title>Nexo Admin · Muestra de sistema</title>

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: panel de gestión con barra lateral (arriba en celular), resumen primero y luego tablas por módulo */
:root{
  --bg:#F3F5FB; --surface:#FFFFFF; --fg:#0E1224; --muted:#5D667C; --line:#E1E6F2;
  --brand:#7C3AED; --brand-soft:#F1EAFE; --side:#12101F; --side-fg:#E9E6F7; --side-muted:#9C97B8;
  --ok:#15803D; --ok-bg:#E8F6EC; --warn:#B45309; --warn-bg:#FDF2E3; --bad:#B91C1C; --bad-bg:#FCEAEA; --info:#1D4ED8; --info-bg:#E8EFFD;
  --sans:'DM Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  --mono:'JetBrains Mono',ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0D0C17; --surface:#17152A; --fg:#ECEAF7; --muted:#A09CBA; --line:#2A2745;
  --brand:#A78BFA; --brand-soft:#2A2148; --side:#08070F; --side-fg:#E9E6F7; --side-muted:#8C88A8;
  --ok:#4ADE80; --ok-bg:#12291C; --warn:#FBBF24; --warn-bg:#2D2312; --bad:#F87171; --bad-bg:#311717; --info:#93C5FD; --info-bg:#16223D; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0D0C17; --surface:#17152A; --fg:#ECEAF7; --muted:#A09CBA; --line:#2A2745;
  --brand:#A78BFA; --brand-soft:#2A2148; --side:#08070F; --side-fg:#E9E6F7; --side-muted:#8C88A8;
  --ok:#4ADE80; --ok-bg:#12291C; --warn:#FBBF24; --warn-bg:#2D2312; --bad:#F87171; --bad-bg:#311717; --info:#93C5FD; --info-bg:#16223D; color-scheme:dark}
*{box-sizing:border-box}
html,body{min-height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--sans);font-size:15px;line-height:1.5}
.app{display:grid;grid-template-columns:230px 1fr;min-height:100vh}
.app>*{min-width:0}
aside{background:var(--side);color:var(--side-fg);padding-block:22px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:16px;display:flex;flex-direction:column;gap:22px}
.logo{display:flex;align-items:center;gap:10px}
.logo .dial{font-family:var(--mono);font-weight:600;font-size:13px;background:var(--brand);color:#fff;border-radius:8px;padding:6px 8px}
.logo b{font-size:17px;display:block;line-height:1.1}
.logo small{color:var(--side-muted);font-size:12px}
nav{display:flex;flex-direction:column;gap:4px}
nav button{all:unset;cursor:pointer;padding:9px 12px;border-radius:8px;color:var(--side-muted);font-size:14.5px;display:flex;justify-content:space-between;align-items:center}
nav button:hover{color:var(--side-fg);background:rgba(255,255,255,.06)}
nav button[aria-current="true"]{background:rgba(167,139,250,.18);color:var(--side-fg)}
nav button:focus-visible{outline:2px solid var(--brand)}
nav .count{font-family:var(--mono);font-size:11px;background:rgba(255,255,255,.1);border-radius:99px;padding:1px 7px}
.onair{border:1px solid rgba(255,255,255,.12);border-radius:10px;padding:12px;font-size:13px}
.onair .dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#EF4444;margin-right:6px;animation:pulse 1.6s infinite}
@keyframes pulse{50%{opacity:.35}}
@media (prefers-reduced-motion: reduce){.onair .dot{animation:none}}
.onair b{display:block;margin-top:4px}
.onair small{color:var(--side-muted)}
.wm{position:fixed;right:calc(24px + env(safe-area-inset-right,0px));bottom:calc(24px + env(safe-area-inset-bottom,0px));width:340px;height:auto;opacity:.07;pointer-events:none;z-index:0}
.byjc{margin-top:auto;display:flex;flex-direction:column;gap:6px;color:var(--side-muted);font-size:11px;letter-spacing:.06em;text-transform:uppercase}
.byjc img{width:150px;height:auto}
main{position:relative;z-index:1;padding-block:22px 48px;padding-left:24px;padding-right:max(24px,env(safe-area-inset-right,0px));min-width:0}
.demo{background:var(--warn-bg);color:var(--warn);border-radius:8px;padding:8px 12px;font-size:13px;margin-bottom:18px}
.top{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:end;gap:12px;margin-bottom:18px}
h1{font-size:24px;margin:0;line-height:1.2}
.top p{margin:2px 0 0;color:var(--muted)}
.btn{all:unset;cursor:pointer;background:var(--brand);color:#fff;padding:9px 14px;border-radius:8px;font-weight:500;font-size:14px}
.btn.ghost{background:transparent;color:var(--brand);border:1px solid var(--brand)}
.btn.sm{padding:4px 10px;font-size:12.5px}
.btn:focus-visible{outline:2px solid var(--fg);outline-offset:2px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:18px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px}
.kpi small{color:var(--muted);font-size:12.5px}
.kpi .v{font-family:var(--mono);font-size:22px;font-weight:600;font-variant-numeric:tabular-nums;margin-top:2px}
.kpi .d{font-size:12.5px}
.grid2{display:grid;grid-template-columns:1.4fr 1fr;gap:14px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px;min-width:0}
.panel h2{font-size:15px;margin:0 0 12px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.panel h2 span{color:var(--muted);font-weight:400;font-size:13px}
.tbl{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{text-align:left;padding:9px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:500}
td.n,th.n{text-align:right;font-family:var(--mono);font-variant-numeric:tabular-nums}
tr:last-child td{border-bottom:0}
.pill{display:inline-block;font-size:12px;padding:2px 9px;border-radius:99px;font-weight:500}
.p-ok{background:var(--ok-bg);color:var(--ok)} .p-warn{background:var(--warn-bg);color:var(--warn)} .p-bad{background:var(--bad-bg);color:var(--bad)} .p-info{background:var(--info-bg);color:var(--info)} .p-brand{background:var(--brand-soft);color:var(--brand)}
.bars{display:flex;align-items:end;gap:8px;height:150px;padding-top:8px;border-bottom:1px solid var(--line)}
.bars div{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:end;gap:4px;height:100%}
.bars i{display:block;width:100%;max-width:38px;background:var(--brand-soft);border-radius:5px 5px 0 0}
.bars div:last-child i{background:var(--brand)}
.bars span{font-family:var(--mono);font-size:11px;color:var(--muted)}
.blabels{display:flex;gap:8px;margin-top:6px}
.blabels span{flex:1;text-align:center;font-size:11.5px;color:var(--muted)}
.meter{height:8px;background:var(--line);border-radius:99px;overflow:hidden;min-width:80px}
.meter i{display:block;height:100%;background:var(--brand)}
.feed{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.feed li{display:grid;grid-template-columns:auto 1fr;gap:10px;font-size:14px}
.feed li > div{min-width:0}
.feed small{color:var(--muted);display:block}
.filters{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.filters input,.filters select{font:inherit;padding:7px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--fg)}
.kanban{display:grid;grid-template-columns:repeat(4,minmax(200px,1fr));gap:12px;overflow-x:auto;padding-bottom:6px}
.col{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px;min-width:0}
.col h3{font-size:13px;margin:0 0 10px;display:flex;justify-content:space-between;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.deal{border:1px solid var(--line);border-radius:8px;padding:10px;margin-bottom:8px;font-size:13.5px;background:var(--bg)}
.deal b{display:block}
.deal .m{font-family:var(--mono);font-size:13px}
.deal small{color:var(--muted)}
.deal .acts{margin-top:6px}
.sched{overflow-x:auto}
.sched table td{white-space:normal;min-width:110px;vertical-align:top}
.slot{font-size:12px;border-radius:6px;padding:4px 6px;margin-bottom:4px;background:var(--brand-soft);color:var(--brand)}
.slot.free{background:transparent;border:1px dashed var(--line);color:var(--muted)}
.prog{font-weight:500;white-space:nowrap}
.prog small{display:block;color:var(--muted);font-weight:400;font-family:var(--mono)}
dialog{border:1px solid var(--line);border-radius:12px;background:var(--surface);color:var(--fg);padding:20px;width:min(440px,calc(100vw - 32px))}
dialog::backdrop{background:rgba(10,8,20,.5)}
dialog h2{margin:0 0 12px;font-size:18px}
form.f{display:grid;gap:10px}
form.f label{display:grid;gap:4px;font-size:13px;color:var(--muted)}
form.f input,form.f select{font:inherit;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--fg)}
form.f .row{display:flex;gap:8px;justify-content:end;margin-top:6px}
.toast{position:fixed;right:calc(16px + env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:10px 14px;border-radius:8px;font-size:14px}
@media (max-width:860px){
  .app{grid-template-columns:1fr}
  aside{padding-right:max(16px,env(safe-area-inset-right,0px));gap:14px}
  nav{flex-direction:row;overflow-x:auto;gap:4px}
  nav button{white-space:nowrap}
  .onair{display:none}
  main{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  .grid2{grid-template-columns:1fr}
}
</style>

<script>
const fmt = n => '$' + Math.round(n).toLocaleString('es-AR');
const PAQ = [

  {id:'aireredes', nombre:'Aire + Redes', precio:150000, menciones:30, redes:true},

const PROG = [

let AUSP = [
  {n:'Heladería Polo Sur', r:'Gastronomía', paq:'premium', prog:'tarde', v:'Carla', vence:'2026-11-30', estado:'al día'},
  {n:'Gimnasio Fuerza', r:'Deportes', paq:'aireredes', prog:'desp', v:'Martín', vence:'2026-11-05', estado:'al día'},
  {n:'Óptica Mirada', r:'Salud', paq:'basico', prog:'mana', v:'Sofía', vence:'2026-11-02', estado:'debe'},
  {n:'Pizzería La Esquina', r:'Gastronomía', paq:'aireredes', prog:'ranking', v:'Carla', vence:'2026-12-15', estado:'al día'},
  {n:'Moto Sur Repuestos', r:'Automotor', paq:'basico', prog:'desp', v:'Martín', vence:'2026-11-10', estado:'al día'},
  {n:'Tienda Urbana', r:'Indumentaria', paq:'premium', prog:'tarde', v:'Sofía', vence:'2026-11-03', estado:'debe'},
  {n:'Inmobiliaria Centro', r:'Inmobiliaria', paq:'aireredes', prog:'mana', v:'Carla', vence:'2027-01-31', estado:'al día'},
  {n:'Farmacia Del Parque', r:'Salud', paq:'basico', prog:'finde', v:'Martín', vence:'2026-12-01', estado:'al día'},
  {n:'Academia Inglés Plus', r:'Educación', paq:'aireredes', prog:'ranking', v:'Sofía', vence:'2026-11-20', estado:'al día'},
  {n:'Lavadero Burbujas', r:'Servicios', paq:'basico', prog:'tarde', v:'Carla', vence:'2026-11-04', estado:'vencido'},
];
let DEALS = [

  {n:'Concesionaria Ruta 34', paq:'premium', v:'Sofía', etapa:'Propuesta'},
  {n:'Vivero Las Rosas', paq:'aireredes', v:'Carla', etapa:'Propuesta'},
  {n:'Club de Pádel', paq:'aireredes', v:'Martín', etapa:'Negociando'},
  {n:'Panadería San José', paq:'basico', v:'Sofía', etapa:'Cerrado'},
];
const ETAPAS = ['Contacto','Propuesta','Negociando','Cerrado'];
let FACT = [
  {nro:'0001-00412', n:'Óptica Mirada', monto:85000, vence:'2026-10-20', estado:'vencida'},
  {nro:'0001-00418', n:'Tienda Urbana', monto:260000, vence:'2026-10-25', estado:'vencida'},
  {nro:'0001-00421', n:'Lavadero Burbujas', monto:85000, vence:'2026-11-05', estado:'pendiente'},
  {nro:'0001-00422', n:'Heladería Polo Sur', monto:260000, vence:'2026-11-05', estado:'pendiente'},
  {nro:'0001-00423', n:'Gimnasio Fuerza', monto:150000, vence:'2026-11-05', estado:'pendiente'},
  {nro:'0001-00410', n:'Pizzería La Esquina', monto:150000, vence:'2026-10-05', estado:'cobrada'},
  {nro:'0001-00411', n:'Inmobiliaria Centro', monto:150000, vence:'2026-10-05', estado:'cobrada'},
];
const HOY = new Date('2026-10-29T12:00:00');
const paq = id => PAQ.find(p=>p.id===id);
const prog = id => PROG.find(p=>p.id===id);
const dias = d => Math.round((new Date(d+'T12:00:00') - HOY)/864e5);
const fdate = d => new Date(d+'T12:00:00').toLocaleDateString('es-AR',{day:'2-digit',month:'short'});

const VIEWS = {inicio:'Inicio', auspiciantes:'Auspiciantes', ventas:'Ventas', pautas:'Pautas al aire', cobranzas:'Cobranzas', vendedores:'Vendedores'};
let current = (location.hash||'').slice(1); if(!VIEWS[current]) current='inicio';

function nav(){
  const counts = {auspiciantes:AUSP.length, ventas:DEALS.filter(d=>d.etapa!=='Cerrado').length, cobranzas:FACT.filter(f=>f.estado!=='cobrada').length};
  document.getElementById('nav').innerHTML = Object.entries(VIEWS).map(([k,v])=>
    `<button data-v="${k}" aria-current="${k===current}">${v}${counts[k]!=null?`<span class="count">${counts[k]}</span>`:''}</button>`).join('');
}
document.getElementById('nav').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;go(b.dataset.v)});
function go(v){current=v;try{history.replaceState(null,'','#'+v)}catch(e){};render()}
window.addEventListener('hashchange',()=>{const h=location.hash.slice(1);if(VIEWS[h]){current=h;render()}});

function estadoPill(a){
  const d=dias(a.vence);
  if(a.estado==='vencido') return '<span class="pill p-bad">Contrato vencido</span>';
  if(a.estado==='debe') return '<span class="pill p-warn">Debe factura</span>';
  if(d<=7) return `<span class="pill p-info">Renueva en ${d} días</span>`;
  return '<span class="pill p-ok">Al día</span>';
}
const facturacion = () => AUSP.filter(a=>a.estado!=='vencido').reduce((s,a)=>s+paq(a.paq).precio,0);

function vInicio(){
  const fac=facturacion(), deuda=FACT.filter(f=>f.estado==='vencida').reduce((s,f)=>s+f.monto,0);
  const porVencer=AUSP.filter(a=>dias(a.vence)>=0&&dias(a.vence)<=7);
  const pipe=DEALS.filter(d=>d.etapa!=='Cerrado').reduce((s,d)=>s+paq(d.paq).precio,0);
  const hist=[1480000,1520000,1395000,1610000,1700000,fac];
  const meses=['May','Jun','Jul','Ago','Sep','Oct'];
  const max=Math.max(...hist)*1.1;
  const occ=ocupacion();
  return `
  <div class="top"><div><h1>Buen día</h1><p>Jueves 29 de octubre · así viene el mes</p></div><button class="btn" data-act="nuevo">+ Nuevo auspiciante</button></div>
  <div class="kpis">
    <div class="kpi"><small>Facturación mensual</small><div class="v">${fmt(fac)}</div>${(()=>{const v=Math.round((fac/hist[4]-1)*100);return `<div class="d" style="color:var(${v>=0?"--ok":"--muted"})">${v>=0?"+":""}${v}% vs. septiembre</div>`})()}</div>
    <div class="kpi"><small>Auspiciantes activos</small><div class="v">${AUSP.filter(a=>a.estado!=='vencido').length}</div><div class="d" style="color:var(--muted)">${AUSP.filter(a=>paq(a.paq).redes).length} con redes incluidas</div></div>
    <div class="kpi"><small>Cobros vencidos</small><div class="v" style="color:var(--bad)">${fmt(deuda)}</div><div class="d" style="color:var(--muted)">${FACT.filter(f=>f.estado==='vencida').length} facturas</div></div>
    <div class="kpi"><small>En negociación</small><div class="v">${fmt(pipe)}</div><div class="d" style="color:var(--muted)">${DEALS.filter(d=>d.etapa!=='Cerrado').length} oportunidades</div></div>
  </div>
  <div class="grid2">
    <div class="panel"><h2>Facturación por mes <span>últimos 6 meses</span></h2>
      <div class="bars">${hist.map(h=>`<div><span>${(h/1e6).toFixed(2).replace('.',',')} M</span><i style="height:${h/max*100}%"></i></div>`).join('')}</div>
      <div class="blabels">${meses.map(m=>`<span>${m}</span>`).join('')}</div>
    </div>
    <div class="panel"><h2>Para hacer hoy</h2>
      <ul class="feed">
        ${FACT.filter(f=>f.estado==='vencida').map(f=>`<li><span class="pill p-bad">Cobrar</span><div>${f.n}<small>${fmt(f.monto)} · venció el ${fdate(f.vence)}</small></div></li>`).join('')}
        ${porVencer.map(a=>`<li><span class="pill p-info">Renovar</span><div>${a.n}<small>${paq(a.paq).nombre} · vence el ${fdate(a.vence)}</small></div></li>`).join('')}
        <li><span class="pill p-brand">Redes</span><div>Grabar clip para Heladería Polo Sur<small>Incluido en su paquete Premium</small></div></li>
      </ul>
    </div>
  </div>
  <div class="panel" style="margin-top:14px"><h2>Ocupación de tandas por programa <span>menciones vendidas sobre disponibles por semana</span></h2>
    <div class="tbl"><table><tbody>${occ.map(o=>`<tr><td class="prog">${o.p.nombre}<small>${o.p.dias} · ${o.p.hora} h</small></td><td style="width:50%"><div class="meter"><i style="width:${o.pct}%"></i></div></td><td class="n">${o.pct}%</td></tr>`).join('')}</tbody></table></div>
  </div>`;
}
function ocupacion(){
  return PROG.map(p=>{const vend=AUSP.filter(a=>a.prog===p.id&&a.estado!=='vencido').reduce((s,a)=>s+paq(a.paq).menciones/4,0);const cap=p.id==='finde'?20:40;return {p,pct:Math.min(100,Math.round(vend/cap*100))}});
}
let filtro={q:'',prog:''};
function vAusp(){
  const rows=AUSP.filter(a=>(!filtro.q||a.n.toLowerCase().includes(filtro.q.toLowerCase()))&&(!filtro.prog||a.prog===filtro.prog));
  return `<div class="top"><div><h1>Auspiciantes</h1><p>Contratos, paquetes y vencimientos</p></div><button class="btn" data-act="nuevo">+ Nuevo auspiciante</button></div>
  <div class="filters"><input id="q" placeholder="Buscar comercio" value="${filtro.q}" aria-label="Buscar comercio"><select id="fp" aria-label="Filtrar por programa"><option value="">Todos los programas</option>${PROG.map(p=>`<option value="${p.id}" ${filtro.prog===p.id?'selected':''}>${p.nombre}</option>`).join('')}</select></div>
  <div class="panel tbl"><table><thead><tr><th>Comercio</th><th>Paquete</th><th>Programa</th><th>Vendedor</th><th class="n">Mensual</th><th>Vence</th><th>Estado</th></tr></thead><tbody>
  ${rows.map(a=>`<tr><td><b>${a.n}</b><br><small style="color:var(--muted)">${a.r}</small></td><td>${paq(a.paq).nombre}${paq(a.paq).redes?' <span class="pill p-brand">+ redes</span>':''}</td><td>${prog(a.prog).nombre}</td><td>${a.v}</td><td class="n">${fmt(paq(a.paq).precio)}</td><td>${fdate(a.vence)}</td><td>${estadoPill(a)}</td></tr>`).join('')||'<tr><td colspan="7" style="color:var(--muted)">No hay auspiciantes con ese filtro.</td></tr>'}
  </tbody></table></div>
  <div class="panel" style="margin-top:14px"><h2>Paquetes que vende la radio</h2><div class="kpis" style="margin:0">${PAQ.map(p=>`<div class="kpi"><small>${p.nombre}</small><div class="v">${fmt(p.precio)}</div><div class="d" style="color:var(--muted)">${p.menciones} menciones al mes${p.redes?' · clip y story en redes':''}</div></div>`).join('')}</div></div>`;
}
function vVentas(){
  return `<div class="top"><div><h1>Ventas</h1><p>Comercios en conversación, de la primera charla al contrato</p></div></div>
  <div class="kanban">${ETAPAS.map(et=>{const ds=DEALS.filter(d=>d.etapa===et);return `<div class="col"><h3>${et}<span>${ds.length}</span></h3>${ds.map(d=>`<div class="deal"><b>${d.n}</b><span class="m">${fmt(paq(d.paq).precio)}/mes</span><br><small>${paq(d.paq).nombre} · ${d.v}</small>${et!=='Cerrado'?`<div class="acts"><button class="btn ghost sm" data-adv="${d.n}">Avanzar →</button></div>`:''}</div>`).join('')}</div>`}).join('')}</div>`;
}
function vPautas(){
  const diasS=['Lunes','Martes','Miércoles','Jueves','Viernes'];
  return `<div class="top"><div><h1>Pautas al aire</h1><p>Qué menciones salen en cada programa esta semana</p></div></div>
  <div class="panel sched"><table><thead><tr><th>Programa</th>${diasS.map(d=>`<th>${d}</th>`).join('')}</tr></thead><tbody>
  ${PROG.filter(p=>p.id!=='finde').map(p=>{const as=AUSP.filter(a=>a.prog===p.id&&a.estado!=='vencido');return `<tr><td class="prog">${p.nombre}<small>${p.hora} h</small></td>${diasS.map((d,i)=>`<td>${as.map(a=>`<div class="slot">${a.n} · ${Math.round(paq(a.paq).menciones/20)}x</div>`).join('')}${as.length<3?'<div class="slot free">Espacio libre</div>':''}</td>`).join('')}</tr>`}).join('')}
  </tbody></table></div>
  <p style="color:var(--muted);font-size:13px;margin-top:10px">El operador ve esta grilla en el estudio y marca cada mención cuando sale. Así el auspiciante recibe un reporte de lo que se emitió.</p>`;
}
function vCobr(){
  const tot=s=>FACT.filter(f=>f.estado===s).reduce((a,f)=>a+f.monto,0);
  return `<div class="top"><div><h1>Cobranzas</h1><p>Facturas del mes y quién debe</p></div></div>
  <div class="kpis"><div class="kpi"><small>Cobrado en octubre</small><div class="v" style="color:var(--ok)">${fmt(tot('cobrada'))}</div></div><div class="kpi"><small>Pendiente</small><div class="v">${fmt(tot('pendiente'))}</div></div><div class="kpi"><small>Vencido</small><div class="v" style="color:var(--bad)">${fmt(tot('vencida'))}</div></div></div>
  <div class="panel tbl"><table><thead><tr><th>Factura</th><th>Comercio</th><th class="n">Monto</th><th>Vence</th><th>Estado</th><th></th></tr></thead><tbody>
  ${FACT.map(f=>`<tr><td style="font-family:var(--mono)">${f.nro}</td><td>${f.n}</td><td class="n">${fmt(f.monto)}</td><td>${fdate(f.vence)}</td><td>${f.estado==='cobrada'?'<span class="pill p-ok">Cobrada</span>':f.estado==='vencida'?'<span class="pill p-bad">Vencida</span>':'<span class="pill p-warn">Pendiente</span>'}</td><td>${f.estado!=='cobrada'?`<button class="btn ghost sm" data-cob="${f.nro}">Marcar cobrada</button> <button class="btn ghost sm" data-rec="${f.n}">Recordar por WhatsApp</button>`:''}</td></tr>`).join('')}
  </tbody></table></div>`;
}
function vVend(){
  const com=0.10;
  return `<div class="top"><div><h1>Vendedores</h1><p>Cartera y comisión del mes (10% de lo facturado)</p></div></div>
  <div class="panel tbl"><table><thead><tr><th>Vendedor</th><th class="n">Auspiciantes</th><th class="n">Facturación</th><th class="n">Comisión</th><th class="n">En negociación</th></tr></thead><tbody>
  ${VEND.map(v=>{const as=AUSP.filter(a=>a.v===v&&a.estado!=='vencido');const f=as.reduce((s,a)=>s+paq(a.paq).precio,0);const ds=DEALS.filter(d=>d.v===v&&d.etapa!=='Cerrado');return `<tr><td><b>${v}</b></td><td class="n">${as.length}</td><td class="n">${fmt(f)}</td><td class="n">${fmt(f*com)}</td><td class="n">${ds.length}</td></tr>`}).join('')}
  </tbody></table></div>`;
}
function onair(){
  const p=PROG[2];document.getElementById('onairProg').textContent=p.nombre;
  document.getElementById('onairInfo').textContent=`${p.hora} h · ${AUSP.filter(a=>a.prog===p.id).length} auspiciantes`;
}
function render(){
  nav();
  const v={inicio:vInicio,auspiciantes:vAusp,ventas:vVentas,pautas:vPautas,cobranzas:vCobr,vendedores:vVend}[current]();
  document.getElementById('view').innerHTML=v;
  const q=document.getElementById('q');if(q){q.addEventListener('input',e=>{filtro.q=e.target.value;const pos=e.target.selectionStart;render();const n=document.getElementById('q');n.focus();n.setSelectionRange(pos,pos)})}
  const fp=document.getElementById('fp');if(fp)fp.addEventListener('change',e=>{filtro.prog=e.target.value;render()});
}
function toast(t){const el=document.getElementById('toast');el.textContent=t;el.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>el.hidden=true,2600)}
document.getElementById('view').addEventListener('click',e=>{
  const b=e.target.closest('button');if(!b)return;
  if(b.dataset.act==='nuevo'){document.getElementById('dlg').showModal()}
  if(b.dataset.adv){const d=DEALS.find(x=>x.n===b.dataset.adv);d.etapa=ETAPAS[ETAPAS.indexOf(d.etapa)+1];
    if(d.etapa==='Cerrado'){AUSP.push({n:d.n,r:'Nuevo',paq:d.paq,prog:'mana',v:d.v,vence:'2027-01-31',estado:'al día'});toast(`${d.n} pasó a auspiciante`)}else toast(`${d.n} pasó a ${d.etapa}`);render()}
  if(b.dataset.cob){FACT.find(f=>f.nro===b.dataset.cob).estado='cobrada';const f=FACT.find(f=>f.nro===b.dataset.cob);const a=AUSP.find(a=>a.n===f.n);if(a&&a.estado==='debe')a.estado='al día';toast('Factura marcada como cobrada');render()}
  if(b.dataset.rec){toast(`Recordatorio listo para ${b.dataset.rec} (en el sistema real abre WhatsApp)`)}
});
const sel=(id,arr)=>document.getElementById(id).innerHTML=arr.map(([v,t])=>`<option value="${v}">${t}</option>`).join('');
sel('fPaq',PAQ.map(p=>[p.id,`${p.nombre} · ${fmt(p.precio)}`]));sel('fProg',PROG.map(p=>[p.id,p.nombre]));sel('fVend',VEND.map(v=>[v,v]));
document.getElementById('fCancel').onclick=()=>document.getElementById('dlg').close();
document.getElementById('fAusp').addEventListener('submit',e=>{e.preventDefault();
  const n=document.getElementById('fNombre').value.trim();if(!n)return;
  AUSP.unshift({n,r:document.getElementById('fRubro').value||'Sin rubro',paq:fPaq.value,prog:fProg.value,v:fVend.value,vence:'2026-11-29',estado:'al día'});
  document.getElementById('dlg').close();e.target.reset();toast(`${n} agregado a auspiciantes`);go('auspiciantes')});
onair();render();
</script>

</body>
</html>
