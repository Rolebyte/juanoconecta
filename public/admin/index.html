<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin — JuanoConecta Leads</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'DM Sans',system-ui,sans-serif;background:#0A0A0A;color:#F5F0EB;min-height:100vh}
.login-screen{display:flex;align-items:center;justify-content:center;min-height:100vh}
.login-card{background:#111;border:1px solid #222;border-radius:12px;padding:40px;width:340px}
.login-card h1{font-size:20px;font-weight:500;margin-bottom:6px}
.login-card p{color:#666;font-size:14px;margin-bottom:24px}
.login-card input{width:100%;padding:10px 14px;background:#1a1a1a;border:1px solid #333;border-radius:8px;color:#F5F0EB;font-size:14px;margin-bottom:12px}
.login-card input:focus{outline:none;border-color:#C4846A}
.logo{font-size:14px;font-weight:500;margin-bottom:20px}
.logo span{color:#C4846A}
header{background:#111;border-bottom:1px solid #1e1e1e;padding:14px 28px;display:flex;align-items:center;justify-content:space-between}
.metrics{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;padding:20px 28px 0}
.metric{background:#111;border:1px solid #1e1e1e;border-radius:10px;padding:14px 16px}
.metric-label{font-size:11px;color:#555;margin-bottom:5px}
.metric-val{font-size:22px;font-weight:500}
.metric-val.green{color:#1D9E75}
.metric-val.coral{color:#C4846A}
.metric-val.amber{color:#BA7517}
.chart-wrap{margin:20px 28px 0;background:#111;border:1px solid #1e1e1e;border-radius:10px;padding:16px}
.chart-title{font-size:12px;color:#555;margin-bottom:12px}
.chart-bars{display:flex;align-items:flex-end;gap:6px;height:60px}
.bar-col{display:flex;flex-direction:column;align-items:center;gap:4px;flex:1}
.bar{background:#C4846A;border-radius:3px 3px 0 0;width:100%;min-height:2px;transition:height .3s}
.bar-label{font-size:9px;color:#444;white-space:nowrap}
.bar-val{font-size:9px;color:#666}
.toolbar{padding:16px 28px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.toolbar-left{display:flex;gap:8px}
input.search{padding:7px 12px;background:#111;border:1px solid #222;border-radius:8px;color:#F5F0EB;font-size:13px;width:200px}
input.search:focus{outline:none;border-color:#C4846A}
select.filter{padding:7px 12px;background:#111;border:1px solid #222;border-radius:8px;color:#F5F0EB;font-size:13px;cursor:pointer}
.btn{padding:7px 14px;border-radius:8px;border:1px solid #333;background:transparent;color:#F5F0EB;font-size:12px;cursor:pointer}
.btn:hover{background:#1a1a1a}
.btn-coral{background:#C4846A;border-color:#C4846A;color:#fff}
.btn-coral:hover{background:#b07660}
.btn-sm{padding:5px 10px;font-size:11px}
.table-wrap{margin:0 28px 28px;background:#111;border:1px solid #1e1e1e;border-radius:12px;overflow:hidden}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;padding:10px 14px;font-size:11px;color:#555;border-bottom:1px solid #1e1e1e;font-weight:500;text-transform:uppercase;letter-spacing:.04em}
td{padding:11px 14px;border-bottom:1px solid #141414;color:#ccc}
tr:last-child td{border-bottom:none}
tr:hover td{background:#0f0f0f}
.badge{padding:3px 8px;border-radius:20px;font-size:11px;font-weight:500;display:inline-block}
.badge-pendiente{background:#2a1f0a;color:#BA7517;border:1px solid #3a2a0e}
.badge-enviado{background:#0a1f12;color:#1D9E75;border:1px solid #0e2e1a}
.badge-error{background:#1f0a0a;color:#A32D2D;border:1px solid #2e0e0e}
.badge-rebotado{background:#1a1a1a;color:#666;border:1px solid #222}
.source-tag{padding:2px 7px;border-radius:20px;font-size:10px;background:#1a1a1a;border:1px solid #2a2a2a;color:#666}
.source-tag.popup{color:#534AB7;background:#13103A;border-color:#1e1956}
.source-tag.boton{color:#1D9E75;background:#0a1f12;border-color:#0e2e1a}
.source-tag.manual{color:#BA7517;background:#2a1f0a;border-color:#3a2a0e}
.actions{display:flex;gap:5px}
.empty{text-align:center;padding:50px;color:#444;font-size:13px}
.toast{position:fixed;bottom:20px;right:20px;background:#1D9E75;color:#fff;padding:10px 16px;border-radius:8px;font-size:13px;display:none;z-index:999}
.toast.error{background:#A32D2D}
#app{display:none}
.new-dot{display:inline-block;width:6px;height:6px;background:#C4846A;border-radius:50%;margin-left:4px;vertical-align:middle}
</style>
</head>
<body>

<div class="login-screen" id="login-screen">
  <div class="login-card">
    <div class="logo">Juano<span>Conecta</span></div>
    <h1>Panel de leads</h1>
    <p>Ingresá tu contraseña de admin</p>
    <input type="password" id="pwd-input" placeholder="Contraseña" onkeydown="if(event.key==='Enter')doLogin()">
    <button class="btn btn-coral" style="width:100%;justify-content:center;display:block;text-align:center;padding:10px" onclick="doLogin()">Ingresar</button>
    <p id="login-error" style="color:#A32D2D;font-size:13px;margin-top:10px;display:none">Contraseña incorrecta</p>
  </div>
</div>

<div id="app">
  <header>
    <div style="display:flex;align-items:center;gap:12px">
      <div class="logo" style="margin:0">Juano<span>Conecta</span></div>
      <span style="color:#333">|</span>
      <span style="font-size:13px;color:#555">Leads</span>
    </div>
    <div style="display:flex;gap:8px">
      <button class="btn btn-sm" onclick="loadLeads()">↻ Actualizar</button>
      <button class="btn btn-sm" onclick="exportCSV()">↓ CSV</button>
      <button class="btn btn-sm" onclick="doLogout()" style="color:#444">Salir</button>
    </div>
  </header>

  <!-- Métricas -->
  <div class="metrics" id="metrics">
    <div class="metric"><div class="metric-label">Total leads</div><div class="metric-val" id="m-total">—</div></div>
    <div class="metric"><div class="metric-label">Enviados</div><div class="metric-val green" id="m-enviados">—</div></div>
    <div class="metric"><div class="metric-label">Pendientes</div><div class="metric-val coral" id="m-pendientes">—</div></div>
    <div class="metric"><div class="metric-label">Errores</div><div class="metric-val" style="color:#A32D2D" id="m-errores">—</div></div>
    <div class="metric"><div class="metric-label">Hoy</div><div class="metric-val amber" id="m-hoy">—</div></div>
  </div>

  <!-- Gráfico últimos 7 días -->
  <div class="chart-wrap">
    <div class="chart-title">Leads por día — últimos 7 días</div>
    <div class="chart-bars" id="chart-bars"></div>
  </div>

  <!-- Toolbar -->
  <div class="toolbar">
    <div class="toolbar-left">
      <input class="search" type="text" placeholder="Buscar email..." id="search-input" oninput="renderTable()">
      <select class="filter" id="filter-status" onchange="renderTable()">
        <option value="">Todos los estados</option>
        <option value="pendiente">Pendiente</option>
        <option value="enviado">Enviado</option>
        <option value="error">Error</option>
        <option value="rebotado">Rebotado</option>
      </select>
      <select class="filter" id="filter-source" onchange="renderTable()">
        <option value="">Todos los orígenes</option>
        <option value="popup">Popup</option>
        <option value="boton">Botón</option>
        <option value="manual">Manual</option>
      </select>
    </div>
    <span id="count-label" style="font-size:12px;color:#555"></span>
  </div>

  <!-- Tabla -->
  <div class="table-wrap">
    <table>
      <thead>
        <tr>
          <th>Email</th>
          <th>Origen</th>
          <th>Estado</th>
          <th>Registrado</th>
          <th>Enviado</th>
          <th>Acciones</th>
        </tr>
      </thead>
      <tbody id="leads-body">
        <tr><td colspan="6" class="empty">Cargando...</td></tr>
      </tbody>
    </table>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const SUPABASE_URL = 'https://tmxhjledtweppyacyyxr.supabase.co';
const SUPABASE_KEY = 'sb_publishable_nGMj9NDmgcmGtQ3PTtgm5g_U3EO9kFm';
let allLeads = [];
let adminSecret = localStorage.getItem('admin_secret') || '';

// Auto-login
if (adminSecret) {
  document.getElementById('login-screen').style.display = 'none';
  document.getElementById('app').style.display = 'block';
  loadLeads();
}

function doLogin() {
  const pwd = document.getElementById('pwd-input').value;
  if (!pwd) return;
  adminSecret = pwd;
  localStorage.setItem('admin_secret', pwd);
  document.getElementById('login-screen').style.display = 'none';
  document.getElementById('app').style.display = 'block';
  loadLeads();
}

function doLogout() {
  localStorage.removeItem('admin_secret');
  location.reload();
}

async function loadLeads() {
  try {
    const res = await fetch(`${SUPABASE_URL}/rest/v1/leads?select=*&order=created_at.desc`, {
      headers: { 'apikey': SUPABASE_KEY, 'Authorization': `Bearer ${SUPABASE_KEY}` }
    });
    allLeads = await res.json();
    updateMetrics();
    renderChart();
    renderTable();
  } catch(e) {
    showToast('Error al cargar leads', true);
  }
}

function updateMetrics() {
  const hoy = new Date().toISOString().slice(0,10);
  document.getElementById('m-total').textContent = allLeads.length;
  document.getElementById('m-enviados').textContent = allLeads.filter(l=>l.status==='enviado').length;
  document.getElementById('m-pendientes').textContent = allLeads.filter(l=>l.status==='pendiente').length;
  document.getElementById('m-errores').textContent = allLeads.filter(l=>l.status==='error').length;
  document.getElementById('m-hoy').textContent = allLeads.filter(l=>l.created_at?.slice(0,10)===hoy).length;
}

function renderChart() {
  const container = document.getElementById('chart-bars');
  const days = [];
  for (let i = 6; i >= 0; i--) {
    const d = new Date();
    d.setDate(d.getDate() - i);
    days.push(d.toISOString().slice(0,10));
  }
  const counts = days.map(d => allLeads.filter(l => l.created_at?.slice(0,10) === d).length);
  const max = Math.max(...counts, 1);
  const labels = ['L','M','X','J','V','S','D'];
  const todayIdx = new Date().getDay();
  // reordenar labels para que coincidan con los días
  const dayLabels = days.map(d => {
    const day = new Date(d+'T12:00:00').toLocaleDateString('es-AR',{weekday:'short'}).slice(0,1).toUpperCase();
    return day;
  });
  container.innerHTML = counts.map((count, i) => `
    <div class="bar-col">
      <div class="bar-val">${count > 0 ? count : ''}</div>
      <div class="bar" style="height:${Math.max((count/max)*50, count>0?4:1)}px;opacity:${i===6?'1':'0.6'}"></div>
      <div class="bar-label">${dayLabels[i]}</div>
    </div>
  `).join('');
}

function renderTable() {
  const q = document.getElementById('search-input').value.toLowerCase();
  const st = document.getElementById('filter-status').value;
  const src = document.getElementById('filter-source').value;
  const hoy = new Date().toISOString().slice(0,10);

  const filtered = allLeads.filter(l => {
    const matchQ = !q || l.email.toLowerCase().includes(q);
    const matchSt = !st || l.status === st;
    const matchSrc = !src || l.source === src;
    return matchQ && matchSt && matchSrc;
  });

  document.getElementById('count-label').textContent = `${filtered.length} lead${filtered.length!==1?'s':''}`;

  if (!filtered.length) {
    document.getElementById('leads-body').innerHTML = '<tr><td colspan="6" class="empty">Sin resultados</td></tr>';
    return;
  }

  document.getElementById('leads-body').innerHTML = filtered.map(l => {
    const isNew = l.created_at?.slice(0,10) === hoy;
    const src = l.source || 'popup';
    return `<tr>
      <td style="color:#F5F0EB;font-weight:500">${l.email}${isNew ? '<span class="new-dot" title="Hoy"></span>' : ''}</td>
      <td><span class="source-tag ${src}">${src}</span></td>
      <td><span class="badge badge-${l.status}">${l.status}</span></td>
      <td style="color:#555">${fmtDate(l.created_at)}</td>
      <td style="color:#555">${l.sent_at ? fmtDate(l.sent_at) : '—'}</td>
      <td>
        <div class="actions">
          <button class="btn btn-sm btn-coral" onclick="resendEmail('${l.id}','${l.email}')">↑ Reenviar</button>
          <select class="btn btn-sm" onchange="changeStatus('${l.id}',this.value);this.value=''">
            <option value="" disabled selected>Estado</option>
            <option value="pendiente">Pendiente</option>
            <option value="enviado">Enviado</option>
            <option value="error">Error</option>
            <option value="rebotado">Rebotado</option>
          </select>
        </div>
      </td>
    </tr>`;
  }).join('');
}

async function resendEmail(leadId, email) {
  showToast('Enviando...');
  try {
    const res = await fetch('/api/resend-lead', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${adminSecret}` },
      body: JSON.stringify({ leadId, email }),
    });
    const data = await res.json();
    if (data.ok) { showToast('Email reenviado'); await loadLeads(); }
    else showToast('Error al reenviar', true);
  } catch { showToast('Error de conexión', true); }
}

async function changeStatus(leadId, status) {
  try {
    await fetch(`${SUPABASE_URL}/rest/v1/leads?id=eq.${leadId}`, {
      method: 'PATCH',
      headers: { 'Content-Type': 'application/json', 'apikey': SUPABASE_KEY, 'Authorization': `Bearer ${SUPABASE_KEY}` },
      body: JSON.stringify({ status }),
    });
    showToast(`Estado → "${status}"`);
    await loadLeads();
  } catch { showToast('Error', true); }
}

function exportCSV() {
  const rows = [['Email','Origen','Estado','Registrado','Enviado'],
    ...allLeads.map(l=>[l.email, l.source||'popup', l.status, fmtDate(l.created_at), l.sent_at?fmtDate(l.sent_at):''])
  ];
  const csv = rows.map(r=>r.map(v=>`"${String(v).replace(/"/g,'""')}"`).join(',')).join('\n');
  const a = document.createElement('a');
  a.href = 'data:text/csv;charset=utf-8,\uFEFF'+encodeURIComponent(csv);
  a.download = `juanoconecta-leads-${new Date().toISOString().slice(0,10)}.csv`;
  a.click();
}

function fmtDate(iso) {
  if (!iso) return '—';
  return new Date(iso).toLocaleDateString('es-AR',{day:'2-digit',month:'2-digit',year:'2-digit',hour:'2-digit',minute:'2-digit'});
}

function showToast(msg, isError=false) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'toast'+(isError?' error':'');
  t.style.display = 'block';
  setTimeout(()=>t.style.display='none', 2500);
}
</script>
</body>
</html>
